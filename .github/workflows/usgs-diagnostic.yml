name: USGS archive format diagnostic
on:
  push:
    branches: [feat/usgs-spectral-dataset]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dataset]'
      - name: Inspect measured archive
        run: |
          python - <<'PY'
          from modulo.spectral_dataset import fetch, numbers, prepare
          from zipfile import ZipFile
          import collections
          p=fetch('datasets/raw/ASCIIdata_splib07a.zip')
          with ZipFile(p) as z:
              paths=z.namelist()
              print('ZIP_MEMBERS',len(paths))
              print('FIRST_PATHS',repr(paths[:35]))
              print('MINERAL_EXAMPLES',repr([x for x in paths if 'ChapterM' in x][:25]))
              print('WAVELENGTH_EXAMPLES',repr([x for x in paths if 'wavelength' in x.lower()][:20]))
              for x in [v for v in paths if v.lower().endswith('.txt')][:8]:
                  print('EXAMPLE',repr(x),repr(z.read(x)[:170]))
          print('PREPARE_RESULT',prepare(p,'datasets/usgs-validation'))
          PY
